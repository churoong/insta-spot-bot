name: 모음집 자동 발행

on:
  workflow_dispatch: # 수동 실행 (테스트용)
    inputs:
      dry:
        description: "발행 없이 표지만 렌더해 아티팩트로 업로드 (서체·디자인 검증용)"
        type: boolean
        default: false
      theme:
        description: "테마 키를 지정하면 그 테마만 시도 (예: area-seongsu — 실패한 회차 재발행용)"
        type: string
        default: ""
      force:
        description: "인스타에서 지운 회차를 같은 날 다시 올릴 때 — 하루 1회 가드 생략 + 그 테마의 오늘 행 삭제 (theme 필수)"
        type: boolean
        default: false
  schedule:
    # 크론 지연 실측(2026-08-19~09-01): 정상기 22~44분, 혼잡기 4~11.6시간(중앙값 ~5h).
    # 게다가 지연이 크론 간격을 넘으면 GitHub이 뒤 슬롯을 드롭해 3중 크론이 무력화됐다.
    # → 목표(KST 17:30, 2026-09-03 사용자 변경)보다 최대 5시간 앞서 1시간 간격으로 깔고,
    #   아래 게이트가 "KST 17:30~22:00 창 안에 도착한 첫 런"만 통과시킨다. 정상기엔
    #   8:30 슬롯이, 혼잡기엔 이른 슬롯의 지연 도착분이 발행을 담당. 하루 1회 가드는 스크립트에.
    - cron: "30 3 * * *"  # KST 12:30 발화 → 5h 지연 시 17:30 도착
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"  # 정상기 담당 (KST 17:30 목표)
    - cron: "30 9 * * *"  # 마지막 안전망 (KST 18:30 목표)

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # TourAPI가 느린 날 15분을 넘겨 타임아웃(9/6 실측) — 사진 판정은 8분 예산으로 별도 제한
    # 같은 워크플로의 런은 직렬 실행 — Vercel 트리거 런과 지연 도착한 schedule 런이 병렬로 돌면
    # 둘 다 하루 1회 가드를 통과해 이중 발행될 수 있다(가드→마커 사이 수 분). 두 번째 런은 대기 후 가드에 걸린다.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: 발행 창 게이트 (KST 17:30~22:00, 수동 실행은 통과)
        id: gate
        run: |
          T=$((10#$(TZ=Asia/Seoul date +%H%M)))
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$T" -ge 1730 ] && [ "$T" -lt 2200 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "발행 창 밖(KST $T) — 스킵. 창 안에 도착하는 다른 슬롯이 발행 담당."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - name: 폰트·ffmpeg 설치 (인포그래픽·표지 릴스 렌더링용)
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum fonts-noto-color-emoji ffmpeg
          # 동봉 폰트(Pretendard·G마켓 산스 — 표지·카드 서체) 설치
          mkdir -p ~/.fonts && cp assets/fonts/*.otf ~/.fonts/ && fc-cache -f > /dev/null

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: 모음집 생성·발행
        if: steps.gate.outputs.go == '1'
        run: npx tsx scripts/make-roundup.mjs
        env:
          # dry 입력 시 발행 없이 표지 미리보기만 (아래 아티팩트 업로드)
          ROUNDUP_DRY: ${{ inputs.dry && '1' || '' }}
          ROUNDUP_THEME: ${{ inputs.theme }}
          ROUNDUP_FORCE: ${{ inputs.force && '1' || '' }}
          # 2026-10-22 훅 컷 A/B 종료(사용자 결정): 훅 없음 6건 시청 중앙 3.5초·조회 217 vs 훅 6건 2.2초·148
          # → 표지 8초 단일컷(grid8) 고정. 강제 회차라 hook_idx는 움직이지 않는다. 다시 켜려면 이 줄 삭제.
          HOOK_CUT: "0"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          # 테마 → 시군구 해석용(지역 사전 가중치). 없으면 가중치만 비활성, 발행은 정상.
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          JEJU_API_KEY: ${{ secrets.JEJU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 인스타 라이브러리 음악 첨부용 (Audio API — FB 로그인 경로). 미설정이면 CC BGM 폴백.
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          # 합성 랭킹(유튜브 버즈)용 — 없으면 블로그 후기 단독으로 폴백
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: DRY 미리보기 업로드
        if: inputs.dry
        uses: actions/upload-artifact@v4
        with:
          name: dry-preview
          # 훅 컷(첫 3초)·페이지형 카드도 담는다 — 사용자는 폰에서 그림으로 판단한다.
          # 스타일에 따라 없는 파일이 생기므로 경고를 내지 않게 ignore.
          if-no-files-found: ignore
          path: |
            roundup-hook-preview.jpg
            roundup-reel-preview.jpg
            pages-preview-*.jpg
            roundup-dry-data.json
