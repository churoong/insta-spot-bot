name: 모음집 캐러셀 발행 (주간 저장형)

on:
  workflow_dispatch: {} # 수동 실행 (테스트용)
  # 2026-10-22 예약 발행 중단(사용자 결정): 7건 조회 중앙 39·도달 13~157 — 9/19 판정선(중앙 100) 미달.
  # 수·토 12:30 슬롯은 countdown.yml(큐레이션)이 맡는다. 수동 실행만 남긴다.

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # TourAPI가 느린 날 15분을 넘겨 타임아웃(9/6 실측)
    # 같은 워크플로의 런은 직렬 실행 — Vercel 트리거 런과 지연 도착한 schedule 런이 병렬로 돌면
    # 둘 다 하루 1회 가드를 통과해 이중 발행될 수 있다(가드→마커 사이 수 분). 두 번째 런은 대기 후 가드에 걸린다.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: 발행 창 게이트 (KST 수·토 12~16시, 수동 실행은 통과)
        id: gate
        run: |
          T=$((10#$(TZ=Asia/Seoul date +%H%M))); D=$(TZ=Asia/Seoul date +%u)
          if [ "${{ github.event_name }}" != "schedule" ] || { { [ "$D" = "3" ] || [ "$D" = "6" ]; } && [ "$T" -ge 1230 ] && [ "$T" -lt 1600 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "발행 창 밖(KST 요일$D $T) — 스킵. 창 안 도착 슬롯이 발행 담당."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - name: 폰트·ffmpeg 설치 (인포그래픽·표지 릴스 렌더링용)
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum fonts-noto-color-emoji ffmpeg
          # 동봉 폰트(Pretendard·G마켓 산스 — 표지·카드 서체) 설치
          mkdir -p ~/.fonts && cp assets/fonts/*.otf ~/.fonts/ && fc-cache -f > /dev/null

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: 캐러셀 생성·발행
        if: steps.gate.outputs.go == '1'
        run: npx tsx scripts/make-roundup.mjs
        env:
          ROUNDUP_STYLE: carousel
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          # 테마 → 시군구 해석용(지역 사전 가중치). 없으면 가중치만 비활성, 발행은 정상.
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          JEJU_API_KEY: ${{ secrets.JEJU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 인스타 라이브러리 음악 첨부용 (Audio API — FB 로그인 경로). 미설정이면 CC BGM 폴백.
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          # 합성 랭킹(유튜브 버즈)용 — 없으면 블로그 후기 단독으로 폴백
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
