name: 모음집 캐러셀 발행 (주간 저장형)

on:
  workflow_dispatch: {} # 수동 실행 (테스트용)
  schedule:
    # 매주 토요일 낮(KST 12:41 목표) — 저장형 캐러셀 실험(릴스와 배포 풀이 다름).
    # 크론 지연(혼잡기 4~10시간+슬롯 드롭) 대비로 앞서 깔고, 게이트가 KST 토 12~16시
    # 창 안 도착 런만 통과. 하루 1회 가드(carousel- prefix)는 스크립트에.
    - cron: "30 22,23 * * 5" # KST 토 07:30·08:30 발화 → 지연분이 창 도착
    - cron: "30 0,1,2 * * 6" # KST 토 09:30~11:30
    - cron: "30 3 * * 6"     # 정상기 담당 (KST 12:30 목표)
    - cron: "30 4,5,6 * * 6" # KST 13:30~15:30 안전망

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 발행 창 게이트 (KST 토 12~16시, 수동 실행은 통과)
        id: gate
        run: |
          T=$((10#$(TZ=Asia/Seoul date +%H%M))); D=$(TZ=Asia/Seoul date +%u)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$D" = "6" ] && [ "$T" -ge 1230 ] && [ "$T" -lt 1600 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "발행 창 밖(KST 요일$D $T) — 스킵. 창 안 도착 슬롯이 발행 담당."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - name: 폰트·ffmpeg 설치 (인포그래픽·표지 릴스 렌더링용)
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum fonts-noto-color-emoji ffmpeg
          # 동봉 폰트(Pretendard·G마켓 산스 — 표지·카드 서체) 설치
          mkdir -p ~/.fonts && cp assets/fonts/*.otf ~/.fonts/ && fc-cache -f > /dev/null

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: 캐러셀 생성·발행
        if: steps.gate.outputs.go == '1'
        run: npx tsx scripts/make-roundup.mjs
        env:
          ROUNDUP_STYLE: carousel
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          JEJU_API_KEY: ${{ secrets.JEJU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 인스타 라이브러리 음악 첨부용 (Audio API — FB 로그인 경로). 미설정이면 CC BGM 폴백.
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          # 합성 랭킹(유튜브 버즈)용 — 없으면 블로그 후기 단독으로 폴백
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
