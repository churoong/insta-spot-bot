name: 정답 공개 스토리

on:
  workflow_dispatch: {} # 수동 실행 (테스트용)
  schedule:
    # KST 10:13 목표. 단일 크론은 혼잡기(8/27~9/1)에 5~11.5시간 밀려 오후 발행됐다.
    # → 앞서 깔고 게이트가 KST 10~14시 창 안 도착 런만 통과. 하루 1회 가드는 스크립트에.
    - cron: "13 22,23 * * *" # KST 07:13·08:13 발화 → 지연분이 창 도착
    - cron: "13 0 * * *"     # KST 09:13
    - cron: "13 1 * * *"     # 정상기 담당 (KST 10:13 목표, 기본 지연 60~85분 감안 시 11시대)
    - cron: "13 2,3,4 * * *" # KST 11:13~13:13 안전망

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 발행 창 게이트 (KST 10~14시, 수동 실행은 통과)
        id: gate
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$H" -ge 10 ] && [ "$H" -lt 14 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "발행 창 밖(KST ${H}시) — 스킵. 창 안 도착 슬롯이 발행 담당."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - name: 한글 폰트 설치
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: 스토리 생성·발행
        if: steps.gate.outputs.go == '1'
        run: npx tsx scripts/make-story.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
