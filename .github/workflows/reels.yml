name: 릴스 자동 발행

on:
  workflow_dispatch: # 수동 실행 (테스트용)
    inputs:
      force:
        description: "발행 창·하루 1회 가드 무시하고 즉시 발행"
        type: boolean
        default: false
  # 2026-10-22 예약 발행 중단(사용자 결정): 78건 조회 중앙 134·저장 평균 0·시청 1.4~2.4초 — 한 번도 퍼진 적 없음.
  # 수동 실행만 남긴다. 다시 켜려면 git 이력에서 schedule 블록을 되살리고 vercel.json·publish-check도 함께.

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # TourAPI가 느린 날 15분을 넘겨 타임아웃(9/6 실측)
    # 같은 워크플로의 런은 직렬 실행 — Vercel 트리거 런과 지연 도착한 schedule 런이 병렬로 돌면
    # 둘 다 하루 1회 가드를 통과해 이중 발행될 수 있다(가드→마커 사이 수 분). 두 번째 런은 대기 후 가드에 걸린다.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      # 스크립트에도 같은 게이트가 있지만, 여기서 미리 자르면 창 밖 런이
      # npm ci·ffmpeg 설치 없이 수 초 만에 끝나 무료 분당량을 아낀다 (프라이빗 저장소).
      - name: 발행 창 게이트 (KST 화·목·토 08~12시, 수동 실행은 통과)
        id: gate
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          D=$(TZ=Asia/Seoul date +%u) # 1=월 … 7=일
          # 요일도 여기서 한 번 더 자른다 — 크론 요일이 UTC라 지연된 런이 KST 다음 날로 넘어올 수 있다.
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$H" -ge 8 ] && [ "$H" -lt 12 ] && case "$D" in 2|4|6) true;; *) false;; esac; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "발행 창 밖(KST ${H}시, 요일 ${D}) — 스킵. 화·목·토 창 안 도착 슬롯이 발행 담당."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - name: ffmpeg + 한글 폰트 설치
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk
          # 동봉 폰트(Pretendard·G마켓 산스) — make-reel.mjs가 나머지 포맷과 같은 서체를
          # 쓰므로 여기도 설치해야 한다. 없으면 조용히 Noto로 폴백해 서체가 어긋난다.
          mkdir -p ~/.fonts && cp assets/fonts/*.otf ~/.fonts/ && fc-cache -f > /dev/null

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: 릴스 생성·발행
        if: steps.gate.outputs.go == '1'
        run: npx tsx scripts/make-reel.mjs
        env:
          # force 입력 시 발행 창·하루 1회 가드 해제(테스트용). "0"이 오버라이드 신호.
          MIN_GAP_MIN: ${{ inputs.force && '0' || '' }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 인스타 라이브러리 음악 첨부용 (Audio API — FB 로그인 경로). 미설정이면 CC BGM 폴백.
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # 후보 수집은 Vercel(/api/reel-candidate)이 담당 — TourAPI가 Actions IP를 차단하므로
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
