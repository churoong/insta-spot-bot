name: 릴스 자동 발행

on:
  workflow_dispatch: # 수동 실행 (테스트용)
    inputs:
      force:
        description: "발행 창·하루 1회 가드 무시하고 즉시 발행"
        type: boolean
        default: false
  schedule:
    # 아침(KST 08~12시) 창에만 발행 — 스크립트가 창 밖·중복 런을 스스로 건너뛴다.
    # 크론 지연 실측(2026-08-19~09-01): 정상기 20~60분, 혼잡기 4~11.5시간 + 슬롯
    # 드롭(하루 16슬롯 중 2~4개만 실행, UTC 00:13은 2주간 0회). 그래서 30분 간격으로
    # 촘촘히 깔아 "그날 처음 실행되는 창 안 슬롯"이 발행을 차지하게 한다.
    - cron: "13,43 23 * * *" # KST 08:13·08:43 목표
    - cron: "13,43 0,1,2 * * *" # KST 09:13~11:43 (지연·드롭 대비, 창 12시 전 마감)

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 스크립트에도 같은 게이트가 있지만, 여기서 미리 자르면 창 밖 런이
      # npm ci·ffmpeg 설치 없이 수 초 만에 끝나 무료 분당량을 아낀다 (프라이빗 저장소).
      - name: 발행 창 게이트 (KST 08~12시, 수동 실행은 통과)
        id: gate
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$H" -ge 8 ] && [ "$H" -lt 12 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "발행 창 밖(KST ${H}시) — 스킵. 창 안 도착 슬롯이 발행 담당."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - name: ffmpeg + 한글 폰트 설치
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: 릴스 생성·발행
        if: steps.gate.outputs.go == '1'
        run: npx tsx scripts/make-reel.mjs
        env:
          # force 입력 시 발행 창·하루 1회 가드 해제(테스트용). "0"이 오버라이드 신호.
          MIN_GAP_MIN: ${{ inputs.force && '0' || '' }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 인스타 라이브러리 음악 첨부용 (Audio API — FB 로그인 경로). 미설정이면 CC BGM 폴백.
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # 후보 수집은 Vercel(/api/reel-candidate)이 담당 — TourAPI가 Actions IP를 차단하므로
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
