name: 릴스 자동 발행

on:
  workflow_dispatch: {} # 수동 실행 (테스트용)
  schedule:
    # 릴스 전용 모드: 릴스가 유일한 피드 발행 수단이므로 하루 여러 번(활동 시간대) 발행.
    # (GitHub Actions 스케줄은 지연이 있어 정확한 시각은 보장 안 됨)
    - cron: "7 2,5,8,11 * * *" # UTC → KST 11:07 · 14:07 · 17:07 · 20:07 (하루 4회)

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg + 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        run: npm ci

      - name: 릴스 생성·발행
        run: npx tsx scripts/make-reel.mjs
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # 후보 수집은 Vercel(/api/reel-candidate)이 담당 — TourAPI가 Actions IP를 차단하므로
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
