name: 밸런스 게임 자동 발행

on:
  workflow_dispatch: {} # 수동 실행 (테스트용)
  schedule:
    # 매주 월·금. 정시 혼잡 회피 + 지연 감안해 이른 저녁 목표.
    - cron: "47 8 * * 1,5" # UTC 08:47 = KST 17:47

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 폰트 + ffmpeg 설치 (한글 텍스트 합성 + VS 릴스 렌더용)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        run: npm ci

      - name: 밸런스 게임 생성·발행
        run: npx tsx scripts/make-balance.mjs
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
